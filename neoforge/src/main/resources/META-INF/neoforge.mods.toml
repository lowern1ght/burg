# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the the Forge version
loaderVersion = "[2,)" #mandatory (NeoForge mod loader uses forge's network protocol; align the floor with the lowest NeoForge version your mod targets, e.g. 21.0.x => 2)

license = "${license}" # Review your options at https://choosealicense.com/.

# A URL to refer people to for problems / questions
issueTrackerURL = "https://github.com/DawnOfTimeMC/onceuponatown/issues"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
logoFile = "${mod_id}.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
logoBlur = false
credits = "${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)

# The mixin config entries to load; the file lives alongside this mods.toml in META-INF.
[[mixins]]
config = "${mod_id}.mixins.json"

# Forge mods load access transformers from META-INF/accesstransformer.cfg by default.
# When targeting NeoForge we keep the same path; nothing to declare here unless we
# need to point ATs at a different location.

[[dependencies.${ mod_id }]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
# This version range declares a minimum for the current mc version, but doesn't restrict the loader so older versions still work.
versionRange = "[${neoforge_version},)" #mandatory (replace with the NeoForge version that pairs with minecraft_version)
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]] #optional
modId = "minecraft"
type = "required" #mandatory
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
