plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

// Mixin configuration block — the 1.0.x ModDev plugin does not register a `mixin {}`
// extension at project level, so the refmap wiring (`mixin { add(...) }`,
// `config(...)`) belongs to a separate Mixin Gradle plugin that the second pass
// will add. For this structural pass the manifest attribute below is the only
// wire-up the build needs.

neoForge {
    version = "${neoforge_version}"

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        register("${mod_id}") {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    implementation 'org.jetbrains:annotations:26.0.2'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

publishMods {
    file = layout.buildDirectory.file("libs/${mod_id}-neoforge-${minecraft_version}-${project.version}.jar")
    modLoaders.add("neoforge")
}
