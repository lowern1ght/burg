plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

// The 1.0.x ModDev plugin has no `mixin {}` DSL, so the Mixin refmap is
// wired manually.
//
// NeoForge 1.21.1 runs with Mojang official mappings at runtime — the same
// names the mod compiles against. The standard Mixin 0.8.5 annotation
// processor ships only ObfuscationServiceMCP (searge/notch) and cannot resolve
// Mojang-mapped @Inject targets, so it is intentionally NOT added to the
// annotation-processor path. Instead a minimal refmap is emitted directly.
//
// The mixin config references "${mod_id}.refmap.json". At runtime the
// mixin loader reads it, finds no entry for "placeInChunk", and falls back to
// the method name from the @Inject annotation — which is already the correct
// Mojang name. The mixin fires.

// Write a minimal refmap so the mixin loader does not log a "refmap can't be
// read" WARN. The mappings are empty because the method names in the @Inject
// annotations are already the runtime (Mojang) names.
def generateRefmap = tasks.register('generateMixinRefmap') {
    group = 'build'
    description = 'Writes a minimal mixin refmap for NeoForge (Mojang-mapped runtime)'
    def output = layout.buildDirectory.file("resources/main/${mod_id}.refmap.json")
    outputs.file(output)
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = '{\n  "mappings": {},\n  "data": {}\n}\n'
    }
}

neoForge {
    version = "${neoforge_version}"

    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        gameTestServer {
            server()
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.gameTestServer', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${mod_id}"
        }
    }

    mods {
        register("${mod_id}") {
            sourceSet(sourceSets.main)
        }
    }

    // The ModDev plugin's `unitTest { enable() }` block launches a full
    // ModLauncher / JUnitUserDev runtime in the test JVM — that boots the
    // mod bus, scans for @SubscribeEvent handlers, and exercises the
    // NeoForge.EVENT_BUS. We do not want that here: Burg's @SubscribeEvent
    // listeners are wired for the NeoForge event bus, not for the
    // junituserdev bus, and the test would fail at ModLoadingException
    // ("Listener for event class ModConfigEvent$Reloading takes an argument
    // that is not valid for this bus") before any @Test method runs. Full
    // server-in-a-test-vm tests are deferred to a future `gametest` source
    // set; the `:neoforge:test` target we want here is the cheap
    // static-initialisation path (Town, RaidManager, BuiltInRegistries),
    // which is wired by the explicit `testImplementation files(...)` carve
    // below — the same shape `:common:test` uses for its MC-typed tests.
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    implementation 'org.jetbrains:annotations:26.0.2'

    // Cloth Config API — `runtimeOnly` so the library is bundled with the mod and the
    // end user does not have to install it separately. Also `compileOnly` so the
    // `neoforge` module can resolve the `Config` interface that the common module's
    // `BurgConfig` exposes through its public surface (ADR-0021).
    // The JAR is vendored at libs/ — see buildSrc/.../multiloader-common.gradle.
    runtimeOnly files(rootProject.ext.clothConfigJar)
    compileOnly files(rootProject.ext.clothConfigJar)

    // Unit-test dependencies for the `:neoforge:test` target. This is the
    // mirror of the `:common:test` ADR-0026 carve-out: the ModDev merged JAR
    // (Minecraft classes) and the four critical transitive deps Town pulls
    // in via its imports (SLF4J for the static logger, brigadier +
    // datafixerupper + authlib for MC types referenced by Town /
    // TickScheduler). All four are scoped to `testImplementation` only —
    // they do not propagate to `:common`'s classpath. Strict versions on
    // brigadier / datafixerupper / authlib match the `:common:test` carve
    // so a future MC bump that changes a transitive version is caught here
    // rather than masking a runtime crash.
    //
    // The merged JAR alone is not enough — `new Town()` triggers Town's
    // static init, which transitively resolves JOML (org.joml.Vector3f via
    // MC's ServerLevel + Vec3), Netty (io.netty.handler.codec.DecoderException
    // via MC's network stack), Mojang's logging facade (com.mojang.logging.LogUtils,
    // referenced by BlockPos's static init), and a stack of other transitive
    // deps. The ModDev plugin writes
    // `${buildDir}/moddev/serverLegacyClasspath.txt` listing every JAR the
    // MC test JVM needs (minus the loader-specific pieces: Mixin's
    // class transformer, ModLauncher, etc. — those are intentionally absent
    // because the `:neoforge:test` target is a plain JUnit run, not a
    // ModLauncher boot).
    //
    // The legacy classpath file is generated by the ModDev plugin's
    // `writeServerLegacyClasspath` task, which is normally only triggered
    // transitively by `runServer` / `prepareServerRun` — when only
    // `:neoforge:test` is invoked, the file doesn't exist and the test
    // JVM falls back to the merged JAR alone, and transitive resolution
    // surfaces a NoClassDefFoundError at test time. We wire the writer as
    // a `dependsOn` of the test task (further down in this file) so the
    // file is generated before the test JVM forks, and read the file at
    // task-execution time via a `doFirst` block that injects every line
    // as a runtime JAR into the test task's classpath. The carve targets
    // `serverLegacyClasspath.txt` (not the `client` / `data` /
    // `gameTestServer` variants) because the wire-up uses server-side MC
    // types (Town's static init pulls in ServerLevel + Vec3).
    //
    // Without the `doFirst` injection, the very first `:neoforge:test`
    // invocation on a clean checkout would crash with the
    // NoClassDefFoundError chain (BlockPos → com.mojang.logging.LogUtils,
    // ResourceLocation → io.netty.handler.codec.DecoderException, Town →
    // both) — exactly the 31-failure mode that was observed on this
    // branch before the fix. The writer is idempotent and UP-TO-DATE on
    // subsequent runs — only the first invocation on a clean checkout
    // pays the cost (a few seconds, writing the file).
    testImplementation files(layout.buildDirectory.file('moddev/artifacts/neoforge-' + project.neoforge_version + '-minecraft-merged.jar'))
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testImplementation 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation 'com.mojang:brigadier:1.3.10'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testImplementation 'com.mojang:authlib:6.0.54'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Wire the ModDev writer task into the `:neoforge:test` task graph and
// inject the legacy classpath JARs into the test JVM at execution time.
// The writer populates `${buildDir}/moddev/serverLegacyClasspath.txt`,
// and the `doFirst` hook reads it line-by-line and appends each JAR path
// to the test task's `classpath` file collection before the test JVM
// forks. See the `dependencies` block above for the rationale.
tasks.named('test').configure {
    dependsOn 'writeServerLegacyClasspath'
    doFirst {
        def file = layout.buildDirectory.file('moddev/serverLegacyClasspath.txt').get().asFile
        if (!file.exists()) {
            throw new GradleException(
                "serverLegacyClasspath.txt missing at test execution time — " +
                "writeServerLegacyClasspath should have populated it via dependsOn")
        }
        def jars = []
        file.eachLine { line ->
            if (line.trim() && new File(line).exists()) {
                jars << line.trim()
            }
        }
        // The Java Test task's `classpath` is a `ConfigurableFileCollection`
        // — we can reassign it at execution time, before the test JVM
        // forks, and Gradle accepts the new value as the runtime input.
        classpath = files(classpath, files(jars))
        logger.lifecycle(
            ":neoforge:test injected ${jars.size()} legacy classpath JAR(s) from " +
            "${file.name} into the test classpath")
    }
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}

// Make the generated refmap part of the jar output.
tasks.named('processResources').configure {
    dependsOn generateRefmap
}

tasks.named('jar').configure {
    dependsOn generateRefmap
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

publishMods {
    file = layout.buildDirectory.file("libs/${mod_id}-neoforge-${minecraft_version}-${project.version}.jar")
    modLoaders.add("neoforge")
}
