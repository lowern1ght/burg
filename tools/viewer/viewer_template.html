<meta charset="utf-8">
<title>Burg — citizen viewer</title>
<style>
  :root { --bg:#17171b; --panel:#1f1f25; --ink:#e8e6e0; --dim:#8b8b93; --hot:#d9b25f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  header { padding:10px 14px; border-bottom:1px solid #2c2c34; }
  header b { color:var(--hot); }
  header span { color:var(--dim); }
  main { display:flex; gap:0; align-items:stretch; min-height:calc(100vh - 44px); }
  #panel { width:320px; flex:0 0 320px; padding:14px; background:var(--panel);
           border-right:1px solid #2c2c34; overflow:auto; }
  #stage { flex:1; position:relative; overflow:hidden; }
  .row { margin-bottom:12px; }
  .row label { display:block; color:var(--dim); margin-bottom:3px; font-size:11px;
                letter-spacing:.06em; text-transform:uppercase; }
  select, button { width:100%; background:#14141a; color:var(--ink); border:1px solid #33333d;
                   padding:5px 7px; font:inherit; border-radius:3px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--hot); }
  .tints { display:flex; gap:4px; flex-wrap:wrap; }
  .tint { width:30px; height:22px; border:2px solid transparent; border-radius:3px;
          cursor:pointer; }
  .tint.on { border-color:var(--hot); }
  .toggles { display:flex; gap:6px; }
  .toggles button.off { opacity:.4; }
  /* --- the 3D box model -------------------------------------------------------------- */
  #scene { position:absolute; inset:0; perspective:900px; }
  #figure { position:absolute; left:50%; top:50%; transform-style:preserve-3d; }
  .part { position:absolute; transform-style:preserve-3d; }
  .face { position:absolute; background-repeat:no-repeat; background-size:100% 100%;
          image-rendering:pixelated; backface-visibility:hidden; }
  #hint { position:absolute; left:12px; bottom:10px; color:var(--dim); font-size:11px; }
  #crowd { position:absolute; inset:0; display:none; overflow:auto; padding:20px;
           grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  #crowd.on { display:grid; }
  #crowd figure { margin:0; background:#1b1b21; border:1px solid #2c2c34; border-radius:4px;
                  padding:8px; text-align:center; }
  #crowd canvas { width:100%; image-rendering:pixelated; }
  #crowd figcaption { color:var(--dim); font-size:10px; margin-top:4px; }
</style>

<header>
  <b>Burg</b> — citizen viewer <span id="counts"></span>
  <span style="float:right">drag to turn · scroll to zoom</span>
</header>

<main>
  <div id="panel">
    <div id="slots"></div>

    <div class="row"><label>layers</label>
      <div class="toggles" id="toggles"></div>
    </div>

    <div class="row"><label>views</label>
      <button id="crowdBtn">crowd of 24 →</button></div>
    <div class="row">
      <button id="spinBtn">stop turning</button></div>

    <div class="row" style="color:var(--dim);font-size:11px;line-height:1.6">
      The shells are real: <b>hat +0.5</b>, second layer <b>+0.25</b>. Silhouette comes from
      the texture's alpha, exactly as in game — so what you see here is what the rig can draw.
      Base is <b>not</b> tintable: the base render pass gets a hardcoded −1.
    </div>
  </div>

  <div id="stage">
    <div id="scene"><div id="figure"></div></div>
    <div id="crowd"></div>
    <div id="hint"></div>
  </div>
</main>

<script>
/*__DATA__*/
/* ---------------------------------------------------------------------------------------
 * A second renderer, so it must not become a second source of truth. Every number about the
 * rig comes from DATA.rig, which `export_rig.py` generates out of `npc_uv.PLAYER_BOXES` —
 * the single owner of the mesh table. Nothing here is retyped from the Java.
 *
 * Tinting is a per-pixel multiply on a canvas rather than a CSS filter, because that is what
 * the game does: RenderLayer.renderColoredCutoutModel multiplies by an ARGB int.
 * ------------------------------------------------------------------------------------- */
const RIG = DATA.rig, MAN = DATA.manifest, TEX = DATA.textures;
const SCALE = 11;                       // screen px per model unit
const FACE_ORDER = ['up','down','right','front','left','back'];

const imgCache = {};
function image(name) {
  if (!name) return null;
  if (imgCache[name]) return imgCache[name];
  const im = new Image(); im.src = TEX[name];
  imgCache[name] = im; return im;
}

/** Crop one face out of a 64x64 skin and multiply it by an ARGB tint. Returns a data URL,
 *  or null if the crop is fully transparent — which is how an empty region disappears
 *  instead of drawing a black square. */
function faceUrl(texName, rect, tint) {
  const im = image(texName);
  if (!im || !im.complete || !im.naturalWidth) return null;
  const [x0, y0, x1, y1] = rect;
  const w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
  if (!w || !h) return null;

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  // Negative spans mean the face is mirrored on the sheet; draw it flipped.
  g.save();
  g.translate(x1 < x0 ? w : 0, y1 < y0 ? h : 0);
  g.scale(x1 < x0 ? -1 : 1, y1 < y0 ? -1 : 1);
  g.drawImage(im, Math.min(x0, x1), Math.min(y0, y1), w, h, 0, 0, w, h);
  g.restore();

  const data = g.getImageData(0, 0, w, h);
  const px = data.data;
  const tr = parseInt(tint.slice(3, 5), 16), tg = parseInt(tint.slice(5, 7), 16),
        tb = parseInt(tint.slice(7, 9), 16);
  let any = false;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i + 3] === 0) continue;
    any = true;
    px[i]     = (px[i]     * tr) / 255;
    px[i + 1] = (px[i + 1] * tg) / 255;
    px[i + 2] = (px[i + 2] * tb) / 255;
  }
  if (!any) return null;
  g.putImageData(data, 0, 0);
  return c.toDataURL();
}

/** Build one cube as six CSS-3D faces. Inflation grows the box on every side, which is what
 *  makes a second layer read as a shell around the part rather than a decal on it. */
function buildPart(name, spec, texName, tint) {
  const inf = spec.inflate;
  const [sx, sy, sz] = spec.size.map((v, i) => v + 2 * inf);
  const [ox, oy, oz] = spec.origin.map(v => v - inf);
  const [px, py, pz] = spec.pivot;

  const part = document.createElement('div');
  part.className = 'part';
  part.dataset.part = name;
  // Model space is x right, y DOWN, z forward — the same handedness as screen space, so the
  // pivot translates straight through with no sign flips.
  part.style.transform =
    `translate3d(${(px + ox) * SCALE}px, ${(py + oy) * SCALE}px, ${oz * SCALE}px)`;

  const W = sx * SCALE, H = sy * SCALE, D = sz * SCALE;
  const geom = {
    front: [W, H, `translate3d(0,0,${D}px)`],
    back:  [W, H, `translate3d(${W}px,0,0) rotateY(180deg)`],
    right: [D, H, `rotateY(-90deg) translate3d(-${D}px,0,0) translate3d(0,0,0)`],
    left:  [D, H, `translate3d(${W}px,0,0) rotateY(90deg)`],
    up:    [W, D, `rotateX(90deg) translate3d(0,0,${D - H}px) translate3d(0,${H}px,0)`],
    down:  [W, D, `translate3d(0,${H}px,0) rotateX(-90deg)`],
  };
  let drew = 0;
  for (const f of FACE_ORDER) {
    const rect = spec.uv[f];
    if (!rect) continue;
    const url = faceUrl(texName, rect, tint);
    if (!url) continue;
    const [w, h, tf] = geom[f];
    const el = document.createElement('div');
    el.className = 'face';
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.transform = tf;
    el.style.backgroundImage = `url(${url})`;
    part.appendChild(el);
    drew++;
  }
  return drew ? part : null;
}

const state = { on: {}, yaw: 28, pitch: -8, zoom: 1, spin: true };

function rebuild() {
  const fig = document.getElementById('figure');
  fig.innerHTML = '';
  let parts = 0, faces = 0;
  for (const [layer, names] of Object.entries(RIG.layers)) {
    if (!state.on[layer]) continue;
    const tex = state[layer];
    if (!tex) continue;
    const tint = RIG.tintable[layer] ? (state[layer + 'Tint'] || '#FFFFFFFF') : '#FFFFFFFF';
    for (const partName of names) {
      const spec = RIG.parts[partName];
      if (!spec) continue;
      const el = buildPart(partName, spec, tex, tint);
      if (el) { fig.appendChild(el); parts++; faces += el.children.length; }
    }
  }
  document.getElementById('hint').textContent =
    `${parts} part(s), ${faces} face(s) drawn — an empty texture region draws nothing, which is`
    + ` how a bald head or a bare torso reads here.`;
  applyCamera();
}

function applyCamera() {
  const fig = document.getElementById('figure');
  // The figure spans y −8 (crown) to 24 (soles); centre on 8 so it turns about its middle.
  fig.style.transform =
    `scale(${state.zoom}) rotateX(${state.pitch}deg) rotateY(${state.yaw}deg)`
    + ` translate3d(0, ${-8 * SCALE}px, 0)`;
}

/* --- controls ----------------------------------------------------------------------- */


function crowd() {
  const box = document.getElementById('crowd');
  box.classList.toggle('on');
  document.getElementById('scene').style.display = box.classList.contains('on') ? 'none' : '';
  if (!box.classList.contains('on')) return;
  box.innerHTML = '';
  const bases = MAN.slots.base.filter(Boolean);
  const garments = MAN.slots.garment.filter(Boolean);
  for (let i = 0; i < 24; i++) {
    const b = bases[Math.floor(Math.random() * bases.length)];
    const g = garments.length ? garments[Math.floor(Math.random() * garments.length)] : '';
    const w = MAN.wealthTints[Math.floor(Math.random() * MAN.wealthTints.length)];
    const fig = document.createElement('figure');
    fig.appendChild(elevation(b, g, w.argb));
    const cap = document.createElement('figcaption');
    cap.textContent = `${b.replace('citizen_', '').replace('.png', '')} · `
      + `${g ? g.replace('_clothes.png', '') : 'no trade'} · ${w.name}`;
    fig.appendChild(cap);
    box.appendChild(fig);
  }
}

/** A flat front elevation for the crowd grid — cheap, and the crowd is judged on variety
 *  rather than on form. The 3D view is where a silhouette is judged. */
function elevation(base, garment, tint) {
  const c = document.createElement('canvas');
  c.width = 16 * 4; c.height = 32 * 4;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  const put = (tex, part, face, dx, dy, tintHere) => {
    const spec = RIG.parts[part]; if (!spec) return;
    const url = faceUrl(tex, spec.uv[face], tintHere);
    if (!url) return;
    const im = new Image(); im.src = url;
    im.onload = () => g.drawImage(im, dx * 4, dy * 4, im.width * 4, im.height * 4);
  };
  const W = '#FFFFFFFF';
  put(base, 'head', 'front', 4, 0, W);
  put(base, 'body', 'front', 4, 8, W);
  put(base, 'r_arm', 'front', 0, 8, W);
  put(base, 'l_arm', 'front', 12, 8, W);
  put(base, 'r_leg', 'front', 4, 20, W);
  put(base, 'l_leg', 'front', 8, 20, W);
  if (garment) {
    put(garment, 'body_outer', 'front', 4, 8, tint);
    put(garment, 'r_arm_outer', 'front', 0, 8, tint);
    put(garment, 'l_arm_outer', 'front', 12, 8, tint);
  }
  return c;
}

/* --- boot ---------------------------------------------------------------------------- */
function boot() {
  // The panel is BUILT FROM THE MANIFEST, not written out by hand. New slots — another
  // covering, a cloak, an apron — appear here the moment `export_rig.py` sees the files, so
  // an agent that adds art does not have to edit this viewer to look at it.
  const slots = document.getElementById('slots');
  const preferred = {garment: 'farmer_clothes.png', hair: 'citizen_hair_00.png'};
  for (const [slot, options] of Object.entries(MAN.slots)) {
    if (!options.filter(Boolean).length) continue;
    const row = document.createElement('div');
    row.className = 'row';
    const tintable = RIG.tintable[slot];
    row.innerHTML = `<label>${slot}${tintable ? ' — tinted layer' : ' — never tinted'}</label>`;
    const sel = document.createElement('select');
    sel.id = 'sel_' + slot;
    for (const o of options) {
      const opt = document.createElement('option');
      opt.value = o; opt.textContent = o ? o.replace('citizen_', '').replace('.png', '')
                                          : '— none —';
      sel.appendChild(opt);
    }
    const want = preferred[slot];
    sel.value = options.includes(want) ? want : options[0];
    state[slot] = sel.value || null;
    sel.onchange = () => { state[slot] = sel.value || null; rebuild(); };
    row.appendChild(sel);
    slots.appendChild(row);

    if (tintable) {
      const tints = slot === 'hair' || slot === 'beard' ? MAN.hairTints : MAN.wealthTints;
      const tRow = document.createElement('div');
      tRow.className = 'row';
      tRow.innerHTML = `<label>${slot} tint</label>`;
      const box = document.createElement('div');
      box.className = 'tints';
      state[slot + 'Tint'] = tints[0].argb;
      tints.forEach((t, i) => {
        const b = document.createElement('div');
        b.className = 'tint' + (i === 0 ? ' on' : '');
        b.style.background = '#' + t.argb.slice(3);
        b.title = t.name;
        b.onclick = () => {
          state[slot + 'Tint'] = t.argb;
          [...box.children].forEach(c => c.classList.remove('on'));
          b.classList.add('on');
          rebuild();
        };
        box.appendChild(b);
      });
      tRow.appendChild(box);
      slots.appendChild(tRow);
    }

    const tg = document.createElement('button');
    tg.dataset.layer = slot; tg.textContent = slot;
    state.on[slot] = true;
    tg.onclick = () => {
      state.on[slot] = !state.on[slot];
      tg.classList.toggle('off', !state.on[slot]);
      rebuild();
    };
    document.getElementById('toggles').appendChild(tg);
  }

  document.getElementById('crowdBtn').onclick = crowd;
  document.getElementById('spinBtn').onclick = e => {
    state.spin = !state.spin;
    e.target.textContent = state.spin ? 'stop turning' : 'start turning';
  };

  const stage = document.getElementById('stage');
  let drag = null;
  stage.onmousedown = e => { drag = [e.clientX, e.clientY]; state.spin = false;
    document.getElementById('spinBtn').textContent = 'start turning'; };
  window.onmouseup = () => drag = null;
  window.onmousemove = e => {
    if (!drag) return;
    state.yaw += (e.clientX - drag[0]) * 0.6;
    state.pitch = Math.max(-80, Math.min(80, state.pitch - (e.clientY - drag[1]) * 0.4));
    drag = [e.clientX, e.clientY];
    applyCamera();
  };
  stage.onwheel = e => {
    e.preventDefault();
    state.zoom = Math.max(0.3, Math.min(3.5, state.zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
    applyCamera();
  };

  document.getElementById('counts').textContent = Object.entries(MAN.slots)
    .map(([k, v]) => `${v.filter(Boolean).length} ${k}`).join(' · ');

  Promise.all(Object.keys(TEX).map(n => image(n).decode?.().catch(() => {})))
    .then(rebuild).catch(rebuild);

  (function turn() {
    if (state.spin) { state.yaw += 0.35; applyCamera(); }
    requestAnimationFrame(turn);
  })();
}
boot();
</script>
