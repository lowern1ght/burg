# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
# in dev
version=0.0.13
group=org.lowern1ght.burg
java_version=21

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# Mod info
mod_name=Burg
mod_author=TheGoldenWorld, lowern1ght (fork maintainer)
mod_id=burg
license=MIT
credits=Poulpinou, Zadrac for the project starting idea and some code elements I reused. Thanks fellas! | Upstream: TheGoldenWorld (DawnOfTimeMC) -- original author of Once Upon a Town. Fork: lowern1ght -- see FORK_NOTICE.md.
description=Burg is a fork of Once Upon a Town that transforms a humble settlement into a thriving town.

# NeoForge
# The NeoForge version that matches minecraft_version=1.21.1 — to be tuned on first clean build.
neoforge_version=21.1.77

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000
