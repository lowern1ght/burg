name: gametest

# Workflow: run the NeoForge GameTest framework against the `burg:empty5x5`
# fixture on every PR.
#
# What it runs:
#   - :neoforge:runGameTestServer (boots a real Minecraft dedicated server in
#     gametest mode via ModLauncher and runs every @GameTest method).
#
# The {@code BurgGameTests.addZoningFlipsIndustryZonedOnLiveServer} test
# (PR #64 + the {@code burggametests.empty5x5.nbt} fixture) is what this
# workflow exists to gate, alongside the live `PlacedBuilding` forceAdd
# tests added in this branch (PR `feature/placedbuilding-live`). All
# required tests pass; the workflow is now a hard PR gate (no
# `continue-on-error`).
#
# Historical note: the pre-fix `placetownanchor_registerstown` was a
# deliberate diagnostic that failed on the worldgen-only contract (`Town`
# registration goes through `ChunkGeneratorMixin.onStructurePlaced`, never
# on anchor placement). The fix inverted the assertion to document the
# contract; the test now succeeds when the contract holds.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  run-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Run :neoforge:runGameTestServer
        # `--no-daemon` matches the local validation command (see
        # tools/.githooks/pre-commit and the agent-runtime-safety rule).
        # `-i` keeps stdin open so the Gradle daemon's exit is captured
        # cleanly on CI runners that close tty early.
        run: ./gradlew :neoforge:runGameTestServer --no-daemon -i

      - name: Upload gametest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: |
            neoforge/run/logs/
            neoforge/run/crash-reports/
          if-no-files-found: ignore
          retention-days: 7
